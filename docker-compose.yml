version: '3.8'

services:
  fastapi:
    image: python:3.11-slim
    container_name: raghd_fastapi
    restart: always
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"
    volumes:
      - ./ml-service:/app